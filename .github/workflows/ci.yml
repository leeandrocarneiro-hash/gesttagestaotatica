name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/gestta-central-authentication
      - feat/gestta-secure-multicompany-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Format and lint authentication changes
        run: |
          bunx prettier --write src/lib/central-auth.server.ts src/lib/central-auth.functions.ts src/lib/central-sheet.functions.ts src/lib/password.server.ts src/lib/password.server.test.ts src/lib/auth.server.ts src/lib/auth.functions.ts src/routes/admin.tsx src/routes/acesso-administrador.tsx src/routes/configurar-administrador.tsx src/routes/planilha-empresa.tsx
          bunx eslint src/lib/central-auth.server.ts src/lib/central-auth.functions.ts src/lib/central-sheet.functions.ts src/lib/password.server.ts src/lib/password.server.test.ts src/routes/admin.tsx src/routes/acesso-administrador.tsx src/routes/configurar-administrador.tsx
      - name: Production build
        if: always()
        run: bun run build
